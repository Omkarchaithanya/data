<svg width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b16"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>

    <!-- Node Gradient -->
    <linearGradient id="nodeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#233554"/>
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arrowhead -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00f0ff" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" rx="10" />

  <!-- Title -->
  <text x="450" y="40" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" letter-spacing="2">ZEAL ARCHITECTURE WORKFLOW</text>

  <!-- Nodes -->
  <!-- Node 1: Bright Data -->
  <rect x="50" y="100" width="160" height="100" rx="8" fill="url(#nodeBg)" stroke="url(#accent)" stroke-width="2" filter="url(#glow)"/>
  <text x="130" y="130" fill="#00f0ff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1. Bright Data</text>
  <text x="130" y="155" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Extraction Engine</text>
  <text x="130" y="175" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Scraper Studio &amp; Proxies</text>

  <!-- Node 2: Drift Detector -->
  <rect x="270" y="100" width="160" height="100" rx="8" fill="url(#nodeBg)" stroke="url(#accent)" stroke-width="2" filter="url(#glow)"/>
  <text x="350" y="130" fill="#00f0ff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2. Drift Detector</text>
  <text x="350" y="155" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Real-Time Validation</text>
  <text x="350" y="175" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Schema &amp; Anomaly Score</text>

  <!-- Node 3: AI Healing -->
  <rect x="490" y="100" width="160" height="100" rx="8" fill="url(#nodeBg)" stroke="#ff003c" stroke-width="2" filter="url(#glow)"/>
  <text x="570" y="130" fill="#ff003c" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3. AI Healing</text>
  <text x="570" y="155" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Anthropic LLM</text>
  <text x="570" y="175" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Auto-Repair Generation</text>

  <!-- Node 4: Trust Ledger -->
  <rect x="710" y="100" width="160" height="100" rx="8" fill="url(#nodeBg)" stroke="url(#accent)" stroke-width="2" filter="url(#glow)"/>
  <text x="790" y="130" fill="#00f0ff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">4. Trust Ledger</text>
  <text x="790" y="155" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Immutable DB</text>
  <text x="790" y="175" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Cryptographic Evidence</text>

  <!-- Node 5: Target Website -->
  <rect x="50" y="270" width="160" height="60" rx="8" fill="url(#nodeBg)" stroke="#64748b" stroke-width="1" stroke-dasharray="4"/>
  <text x="130" y="305" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Target Websites</text>

  <!-- Node 6: Human Review -->
  <rect x="490" y="270" width="160" height="60" rx="8" fill="url(#nodeBg)" stroke="#eab308" stroke-width="2" filter="url(#glow)"/>
  <text x="570" y="305" fill="#eab308" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Human Approval</text>

  <!-- Arrows -->
  <!-- 1 -> 2 -->
  <path d="M 210 150 L 260 150" stroke="url(#accent)" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <text x="235" y="140" fill="#64748b" font-size="10" text-anchor="middle">JSON</text>

  <!-- 2 -> 3 (Drift detected) -->
  <path d="M 430 150 L 480 150" stroke="#ff003c" stroke-width="3" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow)" />
  <text x="455" y="140" fill="#ff003c" font-size="10" text-anchor="middle">DRIFT!</text>

  <!-- 2 -> 4 (Healthy) -->
  <path d="M 350 200 L 350 240 L 790 240 L 790 200" stroke="url(#accent)" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <text x="570" y="235" fill="#00f0ff" font-size="10" text-anchor="middle">Healthy Data -> Direct to Ledger</text>

  <!-- 3 -> 6 -->
  <path d="M 570 200 L 570 260" stroke="#ff003c" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <text x="590" y="235" fill="#94a3b8" font-size="10">Review</text>

  <!-- 6 -> 4 -->
  <path d="M 650 300 L 790 300 L 790 210" stroke="#eab308" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <text x="720" y="315" fill="#eab308" font-size="10" text-anchor="middle">Approved Fix</text>

  <!-- 5 -> 1 -->
  <path d="M 130 270 L 130 210" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  
  <!-- AI loops back to Bright Data -->
  <path d="M 570 100 L 570 60 L 130 60 L 130 90" stroke="#ff003c" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow)" />
  <text x="350" y="55" fill="#ff003c" font-size="10" text-anchor="middle">Inject repaired scraper payload</text>

</svg>
